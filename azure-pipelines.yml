trigger:
  - main

variables:
  imageName: nodejs-tetris
  acrName: acrnodejsdevops.azurecr.io

stages:

# ================= CI STAGE =================
- stage: CI
  displayName: "CI - Build & Code Quality"

  jobs:
    - job: Build
      pool:
        vmImage: ubuntu-latest

      steps:

        - task: NodeTool@0
          displayName: "Install Node.js"
          inputs:
            versionSpec: "16.x"

        - task: JavaToolInstaller@0
          displayName: "Use Java 21"
          inputs:
            versionSpec: "21"
            jdkArchitectureOption: "x64"
            jdkSourceOption: "PreInstalled"

        - script: |
            node -v
            npm -v
            npm install
            npm run build
          displayName: Build Application

        - script: |
            # Install SonarScanner
            npm install -g sonar-scanner

            echo "Scanner version:"
            sonar-scanner --version

            echo "Project: $(SONAR_PROJECT_KEY)"
            echo "Organization: $(SONAR_ORG)"
            echo "Host: $(SONAR_HOST_URL)"
            echo "Token length: ${#SONAR_TOKEN}"

            # Run SonarCloud analysis
            sonar-scanner \
              -Dsonar.projectKey=$(SONAR_PROJECT_KEY) \
              -Dsonar.organization=$(SONAR_ORG) \
              -Dsonar.projectName=$(SONAR_PROJECT_NAME) \
              -Dsonar.sources=. \
              -Dsonar.host.url=$(SONAR_HOST_URL) \
              -Dsonar.token=$SONAR_TOKEN \
              -X
          env:
            SONAR_TOKEN: $(SONAR_TOKEN)
          displayName: "Run SonarCloud Analysis"

# ================= CD STAGE =================
- stage: CD
  displayName: "CD - Docker & AKS Deploy"
  dependsOn: CI

  jobs:
    - job: Deploy
      pool:
        vmImage: ubuntu-latest

      steps:

        - task: Docker@2
          displayName: "Build & Push Docker Image"
          inputs:
            command: buildAndPush
            containerRegistry: "ACR-Conn"
            repository: $(imageName)
            dockerfile: Dockerfile
            tags: |
              latest

        - task: AzureCLI@2
          displayName: "Deploy to AKS (CLI)"
          inputs:
            azureSubscription: "AzureServiceConnection"
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |

              az aks get-credentials \
                --resource-group rg-nodejs-aks-devops \
                --name aks-nodejs-devops \
                --overwrite-existing

              kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

              kubectl apply -f K8S/deployment.yaml -n prod

              kubectl apply -f K8S/service.yaml -n prod

              kubectl get svc -n prod
